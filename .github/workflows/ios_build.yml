name: Build iOS Release (.ipa)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA on macOS Runner
    runs-on: macos-13
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java for any tooling
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Verify Flutter
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Build iOS (No Codesign Release)
        run: |
          flutter build ios --release --no-codesign --dart-define=FTH_API_URL=https://fth.demo-kraiptech.com/api/v1

      - name: Package Payload into IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r FTH-iOS-Release.ipa Payload
          cd ../../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FTH-iOS-Release-ipa
          path: build/ios/iphoneos/FTH-iOS-Release.ipa

      - name: Upload Runner.app.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Runner-app-zip
          path: build/ios/iphoneos/Runner.app
